steps:
  - label: ":docker: :hammer:"
    plugins:
      docker-compose#v5.15.0:
        run: linter

  - label: ":docker: :hammer: Multi-platform validation"
    agents:
      queue: hosted
    command: |
      image="$${BUILDKITE_HOSTED_REGISTRY_URL}/plugin-linter:sup-8210-$${BUILDKITE_BUILD_NUMBER}"

      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        --tag "$${image}" \
        --push \
        .

      docker buildx imagetools inspect "$${image}"
    if: build.branch == "sup-8210-publish-multi-platform-images"

  - wait

  - label: ":docker: :rocket: Latest"
    agents:
      queue: hosted
    command: |
      image="buildkite/plugin-linter:latest"

      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        --tag "$${image}" \
        --push \
        .

      docker buildx imagetools inspect "$${image}"
    plugins:
      - aws-assume-role-with-web-identity#v1.8.0:
          role-arn: arn:aws:iam::445615400570:role/pipeline-buildkite-plugin-linter-deploy
          region: us-east-1
          session-tags:
            - organization_slug
            - organization_id
            - pipeline_slug
      - aws-ssm#v1.1.0:
          parameters:
            BUILDKITE_PLUGIN_DOCKER_LOGIN_USERNAME: /pipelines/buildkite/plugin-linter-deploy/docker-login-username
            DOCKER_LOGIN_PASSWORD: /pipelines/buildkite/plugin-linter-deploy/docker-login-password
      - docker-login#v3.1.0: ~
    if: |
      build.branch == 'master'
  - label: ":docker: :rocket: Tag"
    agents:
      queue: hosted
    command: |
      image="buildkite/plugin-linter:$${BUILDKITE_TAG}"

      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        --tag "$${image}" \
        --push \
        .

      docker buildx imagetools inspect "$${image}"
    plugins:
      - aws-assume-role-with-web-identity#v1.8.0:
          role-arn: arn:aws:iam::445615400570:role/pipeline-buildkite-plugin-linter-deploy
          region: us-east-1
          session-tags:
            - organization_slug
            - organization_id
            - pipeline_slug
      - aws-ssm#v1.1.0:
          parameters:
            BUILDKITE_PLUGIN_DOCKER_LOGIN_USERNAME: /pipelines/buildkite/plugin-linter-deploy/docker-login-username
            DOCKER_LOGIN_PASSWORD: /pipelines/buildkite/plugin-linter-deploy/docker-login-password
      - docker-login#v3.1.0: ~
    if: |
      build.tag != null
